spring:
  application:
    name: grade-validation

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  security:
    admin-api:
      enabled: ${ADMIN_API_AUTH_ENABLED:false}
      key: ${ADMIN_API_KEY:}

logging:
  file:
    name: ${LOG_FILE:logs/grade-validation.log}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 1GB

assistant:
  enabled: ${AI_ASSISTANT_ENABLED:false}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    version: ${ANTHROPIC_VERSION:2023-06-01}
  database:
    url: ${AI_DB_URL:}
    username: ${AI_DB_USERNAME:}
    password: ${AI_DB_PASSWORD:}
  query:
    max-rows: ${AI_DB_MAX_ROWS:100}
    timeout-seconds: ${AI_DB_QUERY_TIMEOUT_SECONDS:5}
