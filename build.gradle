plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jinhakapply'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.apache.poi:poi-ooxml:5.4.1'
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'app.security.admin-api.enabled', 'false'
}

tasks.register('verifyAiReadonlyUserScript') {
	def scriptFile = layout.projectDirectory.file('docs/sql/create_ai_readonly_user.sql')
	inputs.file(scriptFile)
	doLast {
		def sql = scriptFile.asFile.getText('UTF-8')
		if (sql.contains('CHANGE_TO_A_LONG_RANDOM_PASSWORD') || sql =~ /(?i)IDENTIFIED\s+BY\s+'[^']+'/) {
			throw new GradleException('AI read-only user SQL must not contain a password literal or placeholder.')
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyAiReadonlyUserScript')
}

def windowsWithNonAsciiProjectPath = System.getProperty('os.name').toLowerCase().contains('windows')
	&& projectDir.absolutePath.find(/[^\x00-\x7F]/) != null

if (windowsWithNonAsciiProjectPath) {
	def asciiTestRuntimeDirectory = new File(
		System.getProperty('java.io.tmpdir'),
		"grade-validation-test-${Integer.toUnsignedString(projectDir.absolutePath.hashCode())}"
	)
	def mainTestRuntimeJar = tasks.register('mainTestRuntimeJar', Jar) {
		archiveFileName = 'main-test-runtime.jar'
		destinationDirectory = asciiTestRuntimeDirectory
		from sourceSets.main.output
	}
	def testRuntimeJar = tasks.register('testRuntimeJar', Jar) {
		archiveFileName = 'test-runtime.jar'
		destinationDirectory = asciiTestRuntimeDirectory
		from sourceSets.test.output
	}

	tasks.named('test') {
		// Gradle's Windows worker argfile corrupts non-ASCII class-directory paths.
		// ASCII-path jars keep the worker classpath loadable without moving the project.
		dependsOn mainTestRuntimeJar, testRuntimeJar
		classpath = files(testRuntimeJar, mainTestRuntimeJar) + configurations.testRuntimeClasspath
	}
}
